# ==============================================================================
# Docker Compose — Riqsi Rutas Full Stack
# Arquitectura: Supabase Cloud <---> Backend Flask (POO) <---> Frontend React SPA (Nginx)
#
# Uso rápido:
#   1. Copiar .env.docker.example a .env.docker
#   2. Completar SUPABASE_URL y SUPABASE_KEY en .env.docker
#   3. docker compose --env-file .env.docker up --build -d
#
# Variables de entorno requeridas (en .env.docker):
#   SUPABASE_URL          → URL de tu proyecto Supabase
#   SUPABASE_KEY          → Anon key de Supabase
#   VITE_BACKEND          → "supabase" o "firebase" (default: supabase)
#   VITE_FIREBASE_API_KEY            → (solo si VITE_BACKEND=firebase)
#   VITE_FIREBASE_AUTH_DOMAIN        → (solo si VITE_BACKEND=firebase)
#   VITE_FIREBASE_PROJECT_ID         → (solo si VITE_BACKEND=firebase)
#   VITE_FIREBASE_STORAGE_BUCKET     → (solo si VITE_BACKEND=firebase)
#   VITE_FIREBASE_MESSAGING_SENDER_ID→ (solo si VITE_BACKEND=firebase)
#   VITE_FIREBASE_APP_ID             → (solo si VITE_BACKEND=firebase)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend API (Flask + Gunicorn + POO + Supabase Bridge + Dijkstra)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./flask-crud
      dockerfile: Dockerfile
    container_name: riqsi-backend
    restart: always
    ports:
      - "5551:5000"
      - "5000:5000"
      - "5050:5000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - FLASK_ENV=production
      - PORT=5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - riqsi-net

  # ----------------------------------------------------------------------------
  # 2. Frontend Web Application (React + Vite + Nginx Reverse Proxy)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${SUPABASE_URL:-}
        - VITE_SUPABASE_ANON_KEY=${SUPABASE_KEY:-}
        - VITE_BASE_PATH=/
        - VITE_BACKEND=${VITE_BACKEND:-supabase}
        - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY:-}
        - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN:-}
        - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID:-}
        - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET:-}
        - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID:-}
    container_name: riqsi-frontend
    restart: always
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - riqsi-net

networks:
  riqsi-net:
    driver: bridge
